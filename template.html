<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/*
  Palette is grayscale by necessity, so contrast has to come from somewhere else.
  Here it comes from width: one family (Archivo, variable width axis) set very
  wide for data and very narrow for text. Reads clearly at 16 gray levels from
  across a room, which colour and hairline decoration would not.
*/
:root {
  --ink: #000000;
  --ink-2: #2b2b2b;
  --mid: #6e6e6e;
  --rule: #b4b4b4;
  --paper: #ffffff;
  --pad: 40px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1072px;
  height: 1448px;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: "Archivo", sans-serif;
  -webkit-font-smoothing: antialiased;
}

body { padding: var(--pad); display: flex; flex-direction: column; }

.label {
  font-variation-settings: "wdth" 100, "wght" 700;
  font-size: 15px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mid);
}

/* ---------- masthead ---------- */

.masthead { display: flex; align-items: baseline; justify-content: space-between; }

.day {
  font-variation-settings: "wdth" 62, "wght" 800;
  font-size: 96px;
  line-height: 0.86;
  letter-spacing: -0.01em;
}

.datenum {
  font-variation-settings: "wdth" 100, "wght" 500;
  font-size: 22px;
  letter-spacing: 0.16em;
  color: var(--ink-2);
}

/* ---------- weather ---------- */

.weather {
  margin-top: 26px;
  padding-bottom: 24px;
  border-bottom: 3px solid var(--ink);
  display: flex;
  align-items: flex-end;
  gap: 32px;
}

.temp {
  font-variation-settings: "wdth" 125, "wght" 700;
  font-size: 190px;
  line-height: 0.78;
  letter-spacing: -0.03em;
}

.temp sup { font-size: 54px; vertical-align: top; line-height: 1; }

.wx { flex: 1; padding-bottom: 10px; }

.cond {
  font-variation-settings: "wdth" 75, "wght" 600;
  font-size: 40px;
  line-height: 1.05;
  margin-bottom: 14px;
}

.stats { display: flex; gap: 26px; }

.stat { display: flex; flex-direction: column; gap: 4px; }

.stat b {
  font-variation-settings: "wdth" 100, "wght" 700;
  font-size: 30px;
}

/* ---------- all-day ---------- */

.allday {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}

.chip {
  font-variation-settings: "wdth" 75, "wght" 600;
  font-size: 19px;
  padding: 7px 14px;
  background: var(--ink);
  color: var(--paper);
}

/* ---------- the rail ---------- */

.rail {
  position: relative;
  margin-top: 26px;
  height: {{RAILH}}px;
  padding-left: 86px;
}

.hour {
  position: absolute;
  left: 0;
  width: 100%;
  border-top: 1px solid var(--rule);
  height: 0;
}

.hour span {
  position: absolute;
  left: 0;
  top: -11px;
  width: 62px;
  text-align: right;
  font-variation-settings: "wdth" 100, "wght" 600;
  font-size: 17px;
  color: var(--mid);
  background: var(--paper);
  padding-right: 6px;
}

.ev {
  position: absolute;
  background: var(--paper);
  border-left: 7px solid var(--ink);
  padding: 6px 12px;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px var(--rule);
}

.ev .evtime {
  font-variation-settings: "wdth" 100, "wght" 700;
  font-size: 16px;
  letter-spacing: 0.06em;
  color: var(--mid);
}

.ev .evtitle {
  font-variation-settings: "wdth" 75, "wght" 700;
  font-size: 25px;
  line-height: 1.12;
  margin-top: 1px;
}

.ev .loc {
  font-variation-settings: "wdth" 75, "wght" 400;
  font-size: 17px;
  color: var(--mid);
  margin-top: 3px;
}

.ev.past { border-left-color: var(--rule); }
.ev.past .evtitle { color: var(--mid); }

/* the one moment of real weight on the page: where you are in the day */
.nowline {
  position: absolute;
  left: 62px;
  right: 0;
  height: 5px;
  background: var(--ink);
}

.nowline::before {
  content: "";
  position: absolute;
  left: -13px;
  top: -7px;
  width: 19px;
  height: 19px;
  background: var(--ink);
  border-radius: 50%;
}

/* ---------- tomorrow ---------- */

.tomorrow {
  margin-top: auto;
  padding-top: 22px;
  border-top: 3px solid var(--ink);
}

.tomorrow-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
}

.tomorrow-wx {
  font-variation-settings: "wdth" 75, "wght" 600;
  font-size: 24px;
}

.trow {
  display: flex;
  gap: 18px;
  padding: 5px 0;
  align-items: baseline;
}

.trow .ttime {
  font-variation-settings: "wdth" 100, "wght" 700;
  font-size: 20px;
  color: var(--mid);
  width: 78px;
  flex-shrink: 0;
}

.trow .ttitle {
  font-variation-settings: "wdth" 75, "wght" 500;
  font-size: 23px;
}

.trow .dim { color: var(--mid); }

.footer {
  margin-top: 16px;
  display: flex;
  justify-content: flex-end;
}
</style>
</head>
<body>

  <div class="masthead">
    <div class="day">{{DATE}}</div>
    <div class="datenum">{{DATENUM}}</div>
  </div>

  <div class="weather">
    <div class="temp">{{TEMP}}<sup>°</sup></div>
    <div class="wx">
      <div class="cond">{{COND}}</div>
      <div class="stats">
        <div class="stat"><span class="label">High</span><b>{{HIGH}}°</b></div>
        <div class="stat"><span class="label">Low</span><b>{{LOW}}°</b></div>
        <div class="stat"><span class="label">Feels</span><b>{{FEELS}}°</b></div>
        <div class="stat"><span class="label">Precip</span><b>{{POP}}%</b></div>
      </div>
    </div>
  </div>

  {{ALLDAY}}

  <div class="rail">
    {{HOURS}}
    {{EVENTS}}
    {{NOWLINE}}
  </div>

  <div class="tomorrow">
    <div class="tomorrow-head">
      <span class="label">Tomorrow</span>
      <span class="tomorrow-wx">{{TMRLABEL}} &nbsp;{{TMRHIGH}}° / {{TMRLOW}}°</span>
    </div>
    {{TMRROWS}}
  </div>

  <div class="footer"><span class="label">Updated {{UPDATED}}</span></div>

</body>
</html>
