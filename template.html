<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/*
  Palette is grayscale by necessity, so contrast has to come from somewhere else.
  Here it comes from width: one family (Archivo, variable width axis) set very
  wide for data and very narrow for text. Reads clearly at 16 gray levels from
  across a room, which colour and hairline decoration would not.

  18px is a hard floor on every font-size below: this renders at ~300ppi on a
  6" screen, so anything smaller stops being legible at arm's length.
*/
:root {
  --ink: #000000;
  --ink-2: #2b2b2b;
  --mid: #6e6e6e;
  --rule: #b4b4b4;
  --paper: #ffffff;
  --pad: 40px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1072px;
  height: 1448px;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: "Archivo", sans-serif;
  -webkit-font-smoothing: antialiased;
}

body { padding: var(--pad); display: flex; flex-direction: column; }

.label {
  font-variation-settings: "wdth" 100, "wght" 700;
  font-size: 20px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mid);
}

/* ---------- masthead ---------- */

.masthead { display: flex; align-items: baseline; justify-content: space-between; }

.day {
  font-variation-settings: "wdth" 62, "wght" 800;
  font-size: 96px;
  line-height: 0.86;
  letter-spacing: -0.01em;
}

.datenum {
  font-variation-settings: "wdth" 100, "wght" 500;
  font-size: 38px;
  letter-spacing: 0.16em;
  color: var(--ink);
}

/* ---------- weather ---------- */

.weather {
  margin-top: 26px;
  padding-bottom: 24px;
  border-bottom: 3px solid var(--ink);
  display: flex;
  align-items: flex-end;
  gap: 28px;
}

.temp {
  font-variation-settings: "wdth" 125, "wght" 700;
  font-size: 190px;
  line-height: 0.78;
  letter-spacing: -0.03em;
}

.temp sup { font-size: 54px; vertical-align: top; line-height: 1; }

.wicon { flex-shrink: 0; padding-bottom: 14px; }

.wx { flex: 1; padding-bottom: 10px; }

.cond {
  font-variation-settings: "wdth" 75, "wght" 600;
  font-size: 40px;
  line-height: 1.05;
  margin-bottom: 14px;
}

.stats { display: flex; gap: 26px; }

.stat { display: flex; flex-direction: column; gap: 4px; }

.stat b {
  font-variation-settings: "wdth" 100, "wght" 700;
  font-size: 26px;
}

.stat.big b {
  font-variation-settings: "wdth" 120, "wght" 800;
  font-size: 46px;
}

/* ---------- hourly forecast ---------- */

.hourly {
  display: flex;
  justify-content: space-between;
  margin-top: 22px;
  padding-bottom: 22px;
  border-bottom: 3px solid var(--ink);
}

.hr {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.hr .hlabel {
  font-variation-settings: "wdth" 100, "wght" 700;
  font-size: 23px;
  color: var(--mid);
}

.hr .htemp {
  font-variation-settings: "wdth" 110, "wght" 700;
  font-size: 30px;
}

/* ---------- all-day ---------- */

.allday {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 18px;
  margin-bottom: 18px;
}

.chip {
  display: block;
  width: 100%;
  font-variation-settings: "wdth" 75, "wght" 700;
  font-size: 33px;
  padding: 17px 18px;
  background: var(--ink);
  color: var(--paper);
}

/* ---------- agenda ---------- */
/* A chronological list, not a time-proportional rail: it condenses dead
   hours instead of spending page space on them. The "now" divider below
   keeps the one thing worth being loud about loud. */

.agenda { margin-top: 22px; }

.aevent {
  display: flex;
  align-items: baseline;
  gap: 20px;
  padding: 15px 0;
  border-bottom: 1px solid var(--rule);
}

.aevent .time {
  font-variation-settings: "wdth" 100, "wght" 700;
  font-size: 27px;
  color: var(--mid);
  width: 104px;
  flex-shrink: 0;
  text-align: right;
}

.aevent .body { flex: 1; min-width: 0; }

.aevent .title {
  font-variation-settings: "wdth" 75, "wght" 700;
  font-size: 35px;
  line-height: 1.15;
}

.aevent .loc {
  font-variation-settings: "wdth" 75, "wght" 400;
  font-size: 25px;
  color: var(--mid);
  margin-top: 3px;
}

.aevent.past .title { color: var(--mid); }
.aevent.past .time { color: var(--rule); }

.title.dim { color: var(--mid); }

.nowrow {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 0;
}

.nowrow .bar { flex: 1; height: 5px; background: var(--ink); }

.nowrow .tag {
  font-variation-settings: "wdth" 100, "wght" 800;
  font-size: 28px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ---------- tomorrow ---------- */

.tomorrow {
  margin-top: auto;
  padding-top: 22px;
  border-top: 3px solid var(--ink);
}

.tomorrow-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
}

.tomorrow-head .label { font-size: 22px; }

.tomorrow-wx {
  font-variation-settings: "wdth" 75, "wght" 600;
  font-size: 31px;
}

.trow {
  display: flex;
  gap: 18px;
  padding: 8px 0;
  align-items: baseline;
}

.trow .ttime {
  font-variation-settings: "wdth" 100, "wght" 700;
  font-size: 27px;
  color: var(--mid);
  width: 94px;
  flex-shrink: 0;
}

.trow .ttitle {
  font-variation-settings: "wdth" 75, "wght" 500;
  font-size: 31px;
}

.trow .dim { color: var(--mid); }

.footer {
  margin-top: 16px;
  display: flex;
  justify-content: flex-end;
}

.footer .label { font-size: 26px; }
</style>
</head>
<body>

  <div class="masthead">
    <div class="day">{{DATE}}</div>
    <div class="datenum">{{DATENUM}}</div>
  </div>

  <div class="weather">
    <div class="temp">{{TEMP}}<sup>°</sup></div>
    <div class="wicon">{{WICON}}</div>
    <div class="wx">
      <div class="cond">{{COND}}</div>
      <div class="stats">
        <div class="stat big"><span class="label">High</span><b>{{HIGH}}°</b></div>
        <div class="stat big"><span class="label">Low</span><b>{{LOW}}°</b></div>
        <div class="stat"><span class="label">Feels</span><b>{{FEELS}}°</b></div>
        <div class="stat"><span class="label">Precip</span><b>{{POP}}%</b></div>
      </div>
    </div>
  </div>

  <div class="hourly">
    {{HOURLY}}
  </div>

  {{ALLDAY}}

  <div class="agenda">
    {{EVENTS}}
  </div>

  <div class="tomorrow">
    <div class="tomorrow-head">
      <span class="label">Tomorrow</span>
      <span class="tomorrow-wx">{{TMRLABEL}} &nbsp;{{TMRHIGH}}° / {{TMRLOW}}°</span>
    </div>
    {{TMRALLDAY}}
    {{TMRROWS}}
  </div>

  <div class="footer"><span class="label">Updated {{UPDATED}}</span></div>

</body>
</html>
