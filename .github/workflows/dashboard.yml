name: Render dashboard

on:
  schedule:
    # Vestigial: confirmed dead (see CLAUDE.md, "schedule: is dead") and
    # kept only as free redundancy in case GitHub ever quietly fixes it.
    # The real trigger is the Pi (pi/trigger.sh), calling workflow_dispatch
    # every 20 minutes around the clock -- the "Check active hours" step
    # below is what actually gates active vs. quiet hours now, for either
    # trigger source.
    - cron: "3,23,43 10-23,0-3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # for the failure-streak repo variable, see "Render" / "Track render failures" below

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Gates every dispatch, from the Pi or the vestigial cron alike,
      # against actual local wall-clock time.
      #
      # Start is 6:35am, not a round 6:00 or 7:00 -- deliberately tight
      # against the Kindle's 7am QUIET_END. The Pi fires every 20 minutes
      # with no fixed clock alignment (systemd OnUnitActiveSec, relative to
      # whenever it last fired, not synced to :00/:20/:40), so by the
      # pigeonhole principle a 20-minute-wide window is the *shortest*
      # window that's still guaranteed to catch at least one Pi dispatch
      # no matter what phase it's on -- any shorter and a real phase could
      # miss it entirely. 6:35-7:00 is 25 minutes: the 20-minute guarantee
      # plus 5 minutes of padding for actual render+publish time, which
      # isn't instantaneous once a dispatch does land. Moving this earlier
      # "for safety" just burns extra renders the Kindle will never see,
      # since it doesn't wake until 7am regardless.
      - name: Check active hours
        id: check
        run: |
          h=$(TZ="${{ vars.TIMEZONE || 'America/Toronto' }}" date +%H)
          m=$(TZ="${{ vars.TIMEZONE || 'America/Toronto' }}" date +%M)
          total=$((10#$h * 60 + 10#$m))
          if [ "$total" -ge 395 ] && [ "$total" -le 1379 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub's automatic secret-masking silently fails on short, simple
      # values (confirmed: LATITUDE/LONGITUDE print in plaintext in every
      # historical run's log despite being Secrets, right next to ICS_URL
      # correctly masked as *** -- masking only reliably catches longer,
      # higher-entropy strings). Registering them explicitly here, before
      # the Render step's auto-echoed env: block would otherwise print them
      # raw, is the documented workaround for exactly this case.
      - name: Mask short secrets
        if: steps.check.outputs.active == 'true'
        run: |
          echo "::add-mask::${{ secrets.LATITUDE }}"
          echo "::add-mask::${{ secrets.LONGITUDE }}"

      - uses: actions/checkout@v4
        if: steps.check.outputs.active == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip

      # Playwright's own browser binary isn't covered by pip's cache above --
      # without this, every run re-downloads Chromium from scratch on a
      # fresh runner. Keyed to requirements.txt so a playwright version bump
      # invalidates it automatically.
      - name: Cache Playwright browser
        if: steps.check.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.check.outputs.active == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # continue-on-error so a failed render doesn't immediately fail the job
      # (which is what triggers GitHub's email) -- the "Track render
      # failures" step below decides that instead, based on how many in a
      # row this makes. steps.render.outcome still reports the *true*
      # pass/fail here despite continue-on-error (that's what it's for --
      # only the job's own conclusion gets masked).
      - name: Render
        id: render
        if: steps.check.outputs.active == 'true'
        continue-on-error: true
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: python render.py

      # Real destination: a dedicated private repo, so the
      # rendered image (real calendar event titles, effectively a live
      # schedule) never lands anywhere kindle-dash's own visibility affects.
      - name: Publish to output repo
        if: steps.check.outputs.active == 'true' && steps.render.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p /tmp/publish-private
          cp dash.png /tmp/publish-private/
          cp output-repo-readme.md /tmp/publish-private/README.md
          cd /tmp/publish-private
          git init -q
          git checkout -q -b main
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dash.png README.md
          git commit -qm "dashboard $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${{ secrets.OUTPUT_REPO_TOKEN }}@github.com/travismorton1995/kindle-dash-output.git" \
            main

      # Keeps kindle-dash itself from going 60 days without activity, which
      # public repos auto-disable scheduled workflows for. Harmless while
      # still private; needed once it goes public, since the real publish
      # traffic will have moved to kindle-dash-output by then.
      - name: Heartbeat
        if: steps.check.outputs.active == 'true' && steps.render.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p /tmp/heartbeat
          date -u +%FT%TZ > /tmp/heartbeat/heartbeat.txt
          cd /tmp/heartbeat
          git init -q
          git checkout -q -b heartbeat
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add heartbeat.txt
          git commit -qm "heartbeat $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            heartbeat

      # A single failed render is almost always Open-Meteo/calendar
      # flakiness that the next 20-minute cycle recovers from on its own
      # (retried internally too, see render.py's retry_fetch) -- emailing on
      # every one of those meant 4-5 emails for one transient blip (2026-09-02).
      # Only actually fail this job -- which is what triggers GitHub's
      # failure-notification email -- once THRESHOLD consecutive renders have
      # failed in a row, and stay quiet for the rest of that same incident.
      # RENDER_FAIL_STREAK (a repo variable, same mechanism as vars.TIMEZONE
      # above) tracks the count statelessly across runs; a later success
      # resets it to 0, so the next incident notifies fresh.
      - name: Track render failures, only alert after a real streak
        if: steps.check.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          THRESHOLD=3

          if [ "${{ steps.render.outcome }}" = "success" ]; then
            gh variable set RENDER_FAIL_STREAK --body 0 --repo "${{ github.repository }}"
            exit 0
          fi

          prev=$(gh variable get RENDER_FAIL_STREAK --repo "${{ github.repository }}" 2>/dev/null || echo 0)
          streak=$((prev + 1))
          gh variable set RENDER_FAIL_STREAK --body "$streak" --repo "${{ github.repository }}"
          echo "consecutive render failures: $streak"

          if [ "$streak" -eq "$THRESHOLD" ]; then
            echo "::error::Render has now failed $THRESHOLD times in a row -- likely a real problem, not a blip."
            exit 1
          fi
          echo "below threshold, or already alerted earlier in this incident -- not failing the job."
