name: Render dashboard

on:
  schedule:
    # Every 30 min, but only 6am-11pm America/Toronto -- matches
    # QUIET_START/QUIET_END in kindle/config.sh, so we're not rendering and
    # pushing images all night that the Kindle's own quiet-hours skip means
    # it will never fetch.
    #
    # cron is UTC-only and doesn't shift for DST, so this is hardcoded to
    # the current EDT offset (UTC-4): 6:00-22:59 EDT = 10:00-02:59 UTC.
    # During EST (UTC-5, roughly early Nov-mid Mar) this drifts an hour
    # late; shift to "11-23,0-3" then, or just accept a late start/early
    # stop each night for that half of the year.
    #
    # GitHub's cron has a 5-minute floor and fires late under load, which
    # is fine for weather and a calendar.
    - cron: "5,35 10-23,0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Render
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          LATITUDE: ${{ vars.LATITUDE }}
          LONGITUDE: ${{ vars.LONGITUDE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: python render.py

      - name: Publish to output branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/publish
          cp dash.png /tmp/publish/
          cd /tmp/publish
          git init -q
          git checkout -q -b output
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dash.png
          git commit -qm "dashboard $(date -u +%FT%TZ)"
          # Force-push a fresh single-commit branch every time. Without this the
          # repo would grow by one PNG every 30 minutes, forever.
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            output
