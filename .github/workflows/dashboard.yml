name: Render dashboard

on:
  schedule:
    # Every 20 min, 6am-11pm America/Toronto. Starts an hour before the
    # Kindle's own QUIET_END (7am in kindle/config.sh) on purpose: by the
    # time the Kindle wakes for its first fetch of the day, there's already
    # been a render or two, instead of it grabbing the last pre-quiet-hours
    # image from the night before while Actions catches up.
    #
    # cron is UTC-only and doesn't shift for DST, so this window is
    # deliberately wider than 6am-11pm local: it's the union of the EDT
    # (UTC-4) and EST (UTC-5) versions of that range, 10:00-03:59 UTC. The
    # "Check active hours" step below does the real filtering against
    # actual local time, so the schedule stays correct year-round without
    # editing the cron for DST.
    #
    # GitHub's cron has a 5-minute floor and fires late under load, which
    # is fine for weather and a calendar.
    - cron: "5,25,45 10-23,0-3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The cron trigger fires on a UTC window wide enough to cover both
      # EDT and EST (see comment above). This step narrows that down to
      # the real 6am-11pm local target using actual wall-clock time, so
      # a run outside that window (the ~1hr of slack on each end) is a
      # no-op instead of an early/late render.
      - name: Check active hours
        id: check
        run: |
          hour=$(TZ="${{ vars.TIMEZONE || 'America/Toronto' }}" date +%H)
          if [ "$hour" -ge 6 ] && [ "$hour" -le 22 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub's automatic secret-masking silently fails on short, simple
      # values (confirmed: LATITUDE/LONGITUDE print in plaintext in every
      # historical run's log despite being Secrets, right next to ICS_URL
      # correctly masked as *** -- masking only reliably catches longer,
      # higher-entropy strings). Registering them explicitly here, before
      # the Render step's auto-echoed env: block would otherwise print them
      # raw, is the documented workaround for exactly this case.
      - name: Mask short secrets
        if: steps.check.outputs.active == 'true'
        run: |
          echo "::add-mask::${{ secrets.LATITUDE }}"
          echo "::add-mask::${{ secrets.LONGITUDE }}"

      - uses: actions/checkout@v4
        if: steps.check.outputs.active == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip

      # Playwright's own browser binary isn't covered by pip's cache above --
      # without this, every run re-downloads Chromium from scratch on a
      # fresh runner. Keyed to requirements.txt so a playwright version bump
      # invalidates it automatically.
      - name: Cache Playwright browser
        if: steps.check.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.check.outputs.active == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Render
        if: steps.check.outputs.active == 'true'
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: python render.py

      # TEMPORARY dual-publish during the kindle-dash-output migration: the
      # Kindle in the field still fetches from this repo's `output` branch
      # until its on-device config.sh/token get repointed at the new repo.
      # Remove this step once that switch is confirmed -- keeping both
      # around after that just re-exposes the image on this repo for no
      # reason once it goes public.
      - name: Publish to output branch (legacy, remove after device cutover)
        if: steps.check.outputs.active == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/publish
          cp dash.png /tmp/publish/
          cd /tmp/publish
          git init -q
          git checkout -q -b output
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dash.png
          git commit -qm "dashboard $(date -u +%FT%TZ)"
          # Force-push a fresh single-commit branch every time. Without this the
          # repo would grow by one PNG every 30 minutes, forever.
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            output

      # Real destination going forward: a dedicated private repo, so the
      # rendered image (real calendar event titles, effectively a live
      # schedule) never lands anywhere kindle-dash's own visibility affects.
      - name: Publish to output repo
        if: steps.check.outputs.active == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/publish-private
          cp dash.png /tmp/publish-private/
          cd /tmp/publish-private
          git init -q
          git checkout -q -b main
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dash.png
          git commit -qm "dashboard $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${{ secrets.OUTPUT_REPO_TOKEN }}@github.com/travismorton1995/kindle-dash-output.git" \
            main

      # Keeps kindle-dash itself from going 60 days without activity, which
      # public repos auto-disable scheduled workflows for. Harmless while
      # still private; needed once it goes public, since the real publish
      # traffic will have moved to kindle-dash-output by then.
      - name: Heartbeat
        if: steps.check.outputs.active == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/heartbeat
          date -u +%FT%TZ > /tmp/heartbeat/heartbeat.txt
          cd /tmp/heartbeat
          git init -q
          git checkout -q -b heartbeat
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add heartbeat.txt
          git commit -qm "heartbeat $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            heartbeat
