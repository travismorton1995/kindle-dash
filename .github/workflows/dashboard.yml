name: Render dashboard

on:
  schedule:
    # Vestigial: confirmed dead (see CLAUDE.md, "schedule: is dead") and
    # kept only as free redundancy in case GitHub ever quietly fixes it.
    # The real trigger is the Pi (pi/trigger.sh), calling workflow_dispatch
    # every 20 minutes around the clock -- the "Check active hours" step
    # below is what actually gates active vs. quiet hours now, for either
    # trigger source.
    - cron: "3,23,43 10-23,0-3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Gates every dispatch, from the Pi or the vestigial cron alike,
      # against actual local wall-clock time.
      #
      # Start is 6:35am, not a round 6:00 or 7:00 -- deliberately tight
      # against the Kindle's 7am QUIET_END. The Pi fires every 20 minutes
      # with no fixed clock alignment (systemd OnUnitActiveSec, relative to
      # whenever it last fired, not synced to :00/:20/:40), so by the
      # pigeonhole principle a 20-minute-wide window is the *shortest*
      # window that's still guaranteed to catch at least one Pi dispatch
      # no matter what phase it's on -- any shorter and a real phase could
      # miss it entirely. 6:35-7:00 is 25 minutes: the 20-minute guarantee
      # plus 5 minutes of padding for actual render+publish time, which
      # isn't instantaneous once a dispatch does land. Moving this earlier
      # "for safety" just burns extra renders the Kindle will never see,
      # since it doesn't wake until 7am regardless.
      - name: Check active hours
        id: check
        run: |
          h=$(TZ="${{ vars.TIMEZONE || 'America/Toronto' }}" date +%H)
          m=$(TZ="${{ vars.TIMEZONE || 'America/Toronto' }}" date +%M)
          total=$((10#$h * 60 + 10#$m))
          if [ "$total" -ge 395 ] && [ "$total" -le 1379 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub's automatic secret-masking silently fails on short, simple
      # values (confirmed: LATITUDE/LONGITUDE print in plaintext in every
      # historical run's log despite being Secrets, right next to ICS_URL
      # correctly masked as *** -- masking only reliably catches longer,
      # higher-entropy strings). Registering them explicitly here, before
      # the Render step's auto-echoed env: block would otherwise print them
      # raw, is the documented workaround for exactly this case.
      - name: Mask short secrets
        if: steps.check.outputs.active == 'true'
        run: |
          echo "::add-mask::${{ secrets.LATITUDE }}"
          echo "::add-mask::${{ secrets.LONGITUDE }}"

      - uses: actions/checkout@v4
        if: steps.check.outputs.active == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip

      # Playwright's own browser binary isn't covered by pip's cache above --
      # without this, every run re-downloads Chromium from scratch on a
      # fresh runner. Keyed to requirements.txt so a playwright version bump
      # invalidates it automatically.
      - name: Cache Playwright browser
        if: steps.check.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      # Retries --with-deps specifically: that's the part that shells out to
      # apt-get against Google's own Chrome repo, which occasionally serves
      # an apt Hash Sum mismatch -- its InRelease index and Packages.gz
      # fetched a moment apart while the upstream repo was mid-update, not
      # anything wrong on our end (confirmed 2026-09-09, two runs 15 minutes
      # apart, both while this file was unchanged). That mirror desync
      # clears within seconds, so a short-delay retry is the actual fix,
      # not a workaround for something in this repo.
      - name: Install dependencies
        if: steps.check.outputs.active == 'true'
        run: |
          pip install -r requirements.txt
          for attempt in 1 2 3; do
            python -m playwright install --with-deps chromium && break
            if [ "$attempt" = 3 ]; then
              echo "::error::playwright install --with-deps failed 3 times in a row."
              exit 1
            fi
            echo "playwright install --with-deps failed (attempt $attempt/3) -- retrying in 15s"
            sleep 15
          done

      # continue-on-error so a failed render doesn't immediately fail the job
      # (which is what triggers GitHub's email) -- the "Track render
      # failures" step below decides that instead, based on how many in a
      # row this makes. steps.render.outcome still reports the *true*
      # pass/fail here despite continue-on-error (that's what it's for --
      # only the job's own conclusion gets masked).
      - name: Render
        id: render
        if: steps.check.outputs.active == 'true'
        continue-on-error: true
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: python render.py

      # Real destination: a dedicated private repo, so the
      # rendered image (real calendar event titles, effectively a live
      # schedule) never lands anywhere kindle-dash's own visibility affects.
      - name: Publish to output repo
        if: steps.check.outputs.active == 'true' && steps.render.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p /tmp/publish-private
          cp dash.png /tmp/publish-private/
          cp output-repo-readme.md /tmp/publish-private/README.md
          cd /tmp/publish-private
          git init -q
          git checkout -q -b main
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dash.png README.md
          git commit -qm "dashboard $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${{ secrets.OUTPUT_REPO_TOKEN }}@github.com/travismorton1995/kindle-dash-output.git" \
            main

      # Keeps kindle-dash itself from going 60 days without activity, which
      # public repos auto-disable scheduled workflows for. Harmless while
      # still private; needed once it goes public, since the real publish
      # traffic will have moved to kindle-dash-output by then.
      #
      # Builds on the existing heartbeat branch instead of git-init'ing a
      # fresh orphan commit every run: the old version force-pushed a brand
      # new, unrelated single-commit history every ~20 minutes, which is a
      # full ref replacement rather than a normal update. That's the likely
      # cause of the "fatal error in commit_refs" push failures seen
      # 2026-09-08 -- a GitHub-side hiccup handling that pattern at high
      # frequency, not anything about our token or permissions. Fetching the
      # branch first and committing on top makes this an ordinary
      # fast-forward push, which should be far less likely to trip it.
      #
      # That history has to stop growing somewhere, though, or the branch
      # accumulates one tiny commit per run forever. RESET_AFTER caps it:
      # once the branch reaches that many commits, this run squashes back
      # down to a single orphan commit (the old force-push behavior) instead
      # of extending it further. At ~50 active-hours runs/day, 500 is
      # roughly a 10-day cycle -- frequent resets to keep the ref-replacement
      # pattern rare, without going back to doing it on literally every run.
      #
      # continue-on-error stays regardless, as a safety net for whatever
      # flakiness remains -- this step has no bearing on whether the actual
      # dashboard render/publish succeeded.
      - name: Heartbeat
        if: steps.check.outputs.active == 'true' && steps.render.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          RESET_AFTER=500

          mkdir -p /tmp/heartbeat
          cd /tmp/heartbeat
          git init -q
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          reset=true
          if git fetch -q --depth "$RESET_AFTER" "$REPO_URL" heartbeat 2>/dev/null; then
            count=$(git rev-list --count FETCH_HEAD)
            if [ "$count" -lt "$RESET_AFTER" ]; then
              git checkout -q -b heartbeat FETCH_HEAD
              reset=false
            fi
          fi
          if [ "$reset" = true ]; then
            git checkout -q --orphan heartbeat
          fi

          date -u +%FT%TZ > heartbeat.txt
          git add heartbeat.txt
          git commit -qm "heartbeat $(date -u +%FT%TZ)"
          if [ "$reset" = true ]; then
            git push -q --force "$REPO_URL" heartbeat
          else
            git push -q "$REPO_URL" heartbeat
          fi

      # A single failed render is almost always Open-Meteo/calendar
      # flakiness that the next 20-minute cycle recovers from on its own
      # (retried internally too, see render.py's retry_fetch) -- emailing on
      # every one of those meant 4-5 emails for one transient blip (2026-09-02).
      # Only actually fail this job -- which is what triggers GitHub's
      # failure-notification email -- once THRESHOLD consecutive renders have
      # failed in a row, and stay quiet for the rest of that same incident.
      #
      # State lives in a streak.txt file on a dedicated render-fail-streak
      # branch, same force-push-a-throwaway-branch mechanism as Heartbeat
      # above (not a repo Variable: tried that first, but the default
      # GITHUB_TOKEN gets a hard 403 managing repo Variables via the API no
      # matter what `permissions:` grants -- confirmed 2026-09-03 -- while
      # contents: write already works, since Heartbeat already proves it).
      # A later success resets the streak to 0, so the next incident
      # notifies fresh.
      #
      # Same fetch-and-build-on-top-with-periodic-reset shape as Heartbeat,
      # for the same reason: this branch used to git-init a brand new orphan
      # commit and force-push over the old one every run too, and hit the
      # identical GitHub-side "fatal error in commit_refs" push failure
      # (2026-09-08/09) -- on this step, uncaught, which crashed the whole
      # script before it ever reached the real alerting check below.
      # --allow-empty because unlike Heartbeat's timestamp, streak.txt often
      # doesn't change between runs (e.g. 0 -> 0 while renders keep
      # succeeding), and a fast-forward commit with no diff from its parent
      # would otherwise fail outright.
      #
      # Crucially, the push itself must never be allowed to abort the
      # script (hence `|| echo`, not letting set -e do its thing): this
      # step's real job is the THRESHOLD check below, and a git-push flake
      # bookkeeping the streak counter is a different failure from "render
      # actually broke 3 times in a row" and must not be conflated with it
      # or silently swallow that real alert.
      - name: Track render failures, only alert after a real streak
        if: steps.check.outputs.active == 'true'
        run: |
          set -euo pipefail
          THRESHOLD=3
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          RESET_AFTER=500

          mkdir -p /tmp/streak
          cd /tmp/streak
          git init -q
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          prev=0
          reset=true
          if git fetch -q --depth "$RESET_AFTER" "$REPO_URL" render-fail-streak 2>/dev/null; then
            prev=$(git show FETCH_HEAD:streak.txt 2>/dev/null || echo 0)
            count=$(git rev-list --count FETCH_HEAD)
            if [ "$count" -lt "$RESET_AFTER" ]; then
              git checkout -q -b render-fail-streak FETCH_HEAD
              reset=false
            fi
          fi
          if [ "$reset" = true ]; then
            git checkout -q --orphan render-fail-streak
          fi

          if [ "${{ steps.render.outcome }}" = "success" ]; then
            streak=0
          else
            streak=$((prev + 1))
          fi

          echo "$streak" > streak.txt
          git add streak.txt
          git commit -q --allow-empty -m "streak=$streak"
          if [ "$reset" = true ]; then
            git push -q --force "$REPO_URL" render-fail-streak || echo "::warning::render-fail-streak push failed -- continuing, doesn't affect this run's alerting"
          else
            git push -q "$REPO_URL" render-fail-streak || echo "::warning::render-fail-streak push failed -- continuing, doesn't affect this run's alerting"
          fi
          echo "consecutive render failures: $streak"

          if [ "${{ steps.render.outcome }}" != "success" ] && [ "$streak" -eq "$THRESHOLD" ]; then
            echo "::error::Render has now failed $THRESHOLD times in a row -- likely a real problem, not a blip."
            exit 1
          fi
          echo "below threshold, already alerted this incident, or render succeeded -- not failing the job."
