name: Render dashboard
# (touched to force GitHub to re-scan this file as a workflow)

on:
  schedule:
    # Hourly. GitHub's cron has a 5-minute floor and fires late under load,
    # which is fine for weather and a calendar.
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Render
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          LATITUDE: ${{ vars.LATITUDE }}
          LONGITUDE: ${{ vars.LONGITUDE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: python render.py

      - name: Publish to output branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/publish
          cp dash.png /tmp/publish/
          cd /tmp/publish
          git init -q
          git checkout -q -b output
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dash.png
          git commit -qm "dashboard $(date -u +%FT%TZ)"
          # Force-push a fresh single-commit branch every time. Without this the
          # repo would grow by one PNG an hour, forever.
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            output
